<div class="control-panel">
  <h2 class="control-panel-title">🚀 Simulation Control Panel</h2>

  <div class="button-group">
    <button mat-raised-button color="accent" (click)="startSimulation()">Start</button>
    <button mat-raised-button color="warn" (click)="stopSimulation()">Stop</button>
  </div>

  <div class="control-panel-footer">
    <button mat-button color="primary" (click)="resetSimulation()">Reset</button>
  </div>
</div>
